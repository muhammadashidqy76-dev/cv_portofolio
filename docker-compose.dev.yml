# ==============================================================================
# Development / Local Testing Docker Compose
# Run: docker compose -f docker-compose.dev.yml up -d --build
# ==============================================================================
services:
  app:
    build:
      context: .
      target: development
    container_name: cv_app_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - REDIS_HOST=redis
    volumes:
      - .:/var/www/html
    networks:
      - portfolio-dev-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:alpine
    container_name: cv_web_dev
    restart: unless-stopped
    ports:
      - "8080:80"  # Akses lewat http://localhost:8080 (tidak bentrok dengan XAMPP)
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - portfolio-dev-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: cv_db_dev
    restart: unless-stopped
    ports:
      - "3307:3306"  # Akses lewat localhost:3307 (tidak bentrok dengan MySQL XAMPP)
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cv_portofolio}
      MYSQL_USER: ${DB_USERNAME:-cv_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_dev_data:/var/lib/mysql
    networks:
      - portfolio-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: cv_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - portfolio-dev-network

networks:
  portfolio-dev-network:
    driver: bridge

volumes:
  db_dev_data:
    driver: local
